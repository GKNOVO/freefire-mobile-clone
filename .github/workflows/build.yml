name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Unity 2022.3 -> APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Falha em segundos (e com mensagem clara) se o projeto não estiver buildável.
      # Todos os valores abaixo são lidos do próprio projeto — nada de tag/versão no YAML.
      - name: Validar projeto
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }

          [ -f ProjectSettings/ProjectVersion.txt ] \
            || fail "ProjectSettings/ProjectVersion.txt ausente no repositório."
          [ -f ProjectSettings/ProjectSettings.asset ] \
            || fail "ProjectSettings/ProjectSettings.asset ausente no repositório."

          unity_version=$(grep -m1 'm_EditorVersion' ProjectSettings/ProjectVersion.txt | cut -d' ' -f2)
          [ -n "$unity_version" ] || fail "ProjectVersion.txt sem m_EditorVersion."
          echo "Editor: $unity_version"

          grep -qE '^  AndroidTargetSdkVersion: 34$' ProjectSettings/ProjectSettings.asset \
            || fail "AndroidTargetSdkVersion deve ser 34 (encontrado: $(grep -m1 'AndroidTargetSdkVersion' ProjectSettings/ProjectSettings.asset | tr -d ' '))."
          grep -qE '^  AndroidMinSdkVersion: 24$' ProjectSettings/ProjectSettings.asset \
            || fail "AndroidMinSdkVersion deve ser 24 (encontrado: $(grep -m1 'AndroidMinSdkVersion' ProjectSettings/ProjectSettings.asset | tr -d ' '))."
          grep -qE '^  AndroidTargetArchitectures: 2$' ProjectSettings/ProjectSettings.asset \
            || fail "AndroidTargetArchitectures deve ser 2 (ARM64)."
          grep -qE '^  androidUseCustomKeystore: 0$' ProjectSettings/ProjectSettings.asset \
            || fail "androidUseCustomKeystore deve ser 0 (assinatura de debug do Unity)."

          duplicadas=$(grep -oE '^  [A-Za-z][A-Za-z0-9_]*' ProjectSettings/ProjectSettings.asset | sort | uniq -d || true)
          [ -z "$duplicadas" ] || fail "ProjectSettings.asset com chaves duplicadas: $duplicadas"

          for scene in Assets/_Project/Scenes/Boot.unity Assets/_Project/Scenes/Arena.unity; do
            [ -f "$scene" ] || fail "Cena ausente: $scene"
          done

          [ -f ProjectSettings/EditorBuildSettings.asset ] \
            || fail "ProjectSettings/EditorBuildSettings.asset ausente (lista de cenas do build)."

          {
            echo "### Projeto validado"
            echo ""
            echo "- editor: \`$unity_version\`"
            echo "- targetSdk 34 / minSdk 24 / ARM64 / keystore de debug"
            echo "- cenas: Boot.unity, Arena.unity"
          } >> "$GITHUB_STEP_SUMMARY"

      # Cache do Library: primeiro build ~30-50 min, seguintes ~10-20 min.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # Decide o modo de licença ANTES de baixar a imagem do editor (~6-8 GB).
      # O GameCI recusa o build sem uma destas três coisas — e-mail/senha sozinhos
      # NÃO ativam a Unity (erro "Missing Unity License File and no Serial was found"):
      #   Personal  -> UNITY_LICENSE (conteúdo do Unity_lic.ulf) + e-mail + senha
      #   Plus/Pro  -> UNITY_SERIAL (XX-XXXX-XXXX-XXXX-XXXX-XXXX) + e-mail + senha
      #   Servidor  -> UNITY_LICENSING_SERVER (licença flutuante, sem senha no runner)
      - name: Verificar licença da Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }

          creds=0
          if [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then creds=1; fi

          if [ -n "${UNITY_LICENSING_SERVER:-}" ]; then
            modo="servidor de licenças flutuantes"
          elif [ -n "${UNITY_LICENSE:-}" ] && [ "$creds" = 1 ]; then
            echo "$UNITY_LICENSE" | grep -q '<License' \
              || fail "UNITY_LICENSE não parece um .ulf válido (esperado XML com <License id=...>). Copie o arquivo Unity_lic.ulf inteiro."
            modo="Unity Personal (arquivo .ulf)"
          elif [ -n "${UNITY_SERIAL:-}" ] && [ "$creds" = 1 ]; then
            modo="Unity Plus/Pro (serial)"
          else
            cat <<'MSG'
          ::error::Nenhuma licença utilizável. O GameCI aborta com "Missing Unity License File and no Serial was found" porque e-mail e senha sozinhos não ativam a Unity.

          Crie UM destes conjuntos em Settings > Secrets and variables > Actions:
            Personal : UNITY_LICENSE (conteúdo do Unity_lic.ulf) + UNITY_EMAIL + UNITY_PASSWORD
            Plus/Pro : UNITY_SERIAL (XX-XXXX-XXXX-XXXX-XXXX-XXXX) + UNITY_EMAIL + UNITY_PASSWORD
            Servidor : UNITY_LICENSING_SERVER (URL do servidor de licenças)

          Como gerar o .ulf (uma vez só): Unity Hub > Preferences > Licenses > Add >
          "Get a free personal license". O arquivo fica em:
            Windows  C:\ProgramData\Unity\Unity_lic.ulf
            macOS    /Library/Application Support/Unity/Unity_lic.ulf
            Linux    ~/.local/share/unity3d/Unity/Unity_lic.ulf
          MSG
            exit 1
          fi

          echo "Licença: $modo"
          echo "- licença: $modo" >> "$GITHUB_STEP_SUMMARY"

      # Build com o script PADRÃO do GameCI (sem buildMethod customizado): ele usa
      # as cenas de ProjectSettings/EditorBuildSettings.asset e as Player Settings de
      # ProjectSettings.asset (minSdk 24, targetSdk 34, ARM64, IL2CPP) e grava em
      # build/Android/BRMobile.apk. Imagem/versão vêm de ProjectVersion.txt.
      - name: Build APK (GameCI)
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetSdkVersion: 34
          buildName: BRMobile
          versioning: None
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}

      # Um build "verde" sem APK seria uma falha silenciosa: barra aqui.
      - name: Conferir APK gerado
        if: success()
        run: |
          set -eu
          apk=$(find build -name '*.apk' -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "::error::O step de build terminou sem erro, mas nenhum .apk foi gerado em build/. Esperado: build/Android/BRMobile.apk."
            exit 1
          fi
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          echo "- APK: \`$apk\` ($(du -h "$apk" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do build
        if: always()
        run: |
          echo "### Artefatos Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t apks < <(find build -name '*.apk' -type f 2>/dev/null || true)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Nenhum APK encontrado. Veja o log do step **Build APK (GameCI)**." >> "$GITHUB_STEP_SUMMARY"
          else
            for apk in "${apks[@]}"; do
              echo "- \`$apk\` — $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRMobile-APK-${{ github.run_number }}
          path: |
            build/**/*.apk
            Builds/**/*.apk
          if-no-files-found: warn
          retention-days: 14
