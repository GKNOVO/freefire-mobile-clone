name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Unity 2022.3 -> APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache do Library: primeiro build ~30-50 min, seguintes ~10-20 min.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: BR.EditorTools.AndroidBuilder.BuildAndroid
          allowDirtyBuild: true
          versioning: None

      - name: Resumo do build
        if: always()
        run: |
          echo "### Artefatos Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if find build -name '*.apk' -type f | grep -q .; then
            find build -name '*.apk' -type f -printf '- `%p` — %k KB\n' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum APK encontrado. Veja o log do step **Build APK (GameCI)**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRMobile-APK-${{ github.run_number }}
          path: |
            build/**/*.apk
            Builds/**/*.apk
          if-no-files-found: warn
          retention-days: 14
